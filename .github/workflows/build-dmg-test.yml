name: Build .dmg to test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dmg-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Prepare clangd bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run prebuild:clangd

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run prebuild:buildinfo
          npm run prebuild:icons
          test -f build/icons/png/512x512.png
          npx electron-builder --mac dmg --${{ matrix.arch }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-test-${{ matrix.arch }}-artifacts
          path: dist/*.dmg
          if-no-files-found: error
